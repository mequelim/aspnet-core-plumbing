name: Continuous Integration Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore AspNet.Plumbing/AspNet.Plumbing.slnx

    - name: Build
      run: dotnet build AspNet.Plumbing/AspNet.Plumbing.slnx --no-restore --configuration Release
